[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "haar-emotion-sp"
version = "0.1.0"
description = "Visual emotion recognition with ECC, spatial FFT and Haar filter banks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.7",
    "numpy>=1.24",
    "Pillow>=9",
    "PyYAML>=6",
    "scipy>=1.10",
    "torch>=2.4",
    "torchvision>=0.19",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ecc-splits = "ecc.splits:main"
ecc-train = "ecc.supervised:main"
ecc-ssl = "ecc.ssl:main"
ecc-eval = "ecc.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
