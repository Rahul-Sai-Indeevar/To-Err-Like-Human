[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ecc-ver"
version = "0.1.0"
description = "Re-implementation of ECC/EMC metrics for visual emotion recognition (NeurIPS 2024) + experiments"
requires-python = ">=3.9"
dependencies = [
  "torch>=2.3",
  "torchvision",
  "numpy",
  "pyyaml",
  "pillow",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
ecc-splits = "ecc.splits:main"
ecc-train = "ecc.supervised:main"
ecc-ssl = "ecc.ssl:main"
ecc-eval = "ecc.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
